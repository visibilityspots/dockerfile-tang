name: trivy

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
  schedule:
    - cron: '44 19 * * 4'

jobs:
  scan:
    # the repo token defaults to read; SARIF upload needs security-events
    permissions:
      contents: read
      security-events: write
    uses: visibilityspots/github-workflows/.github/workflows/trivy.yml@main
